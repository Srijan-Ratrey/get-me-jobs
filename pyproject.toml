[project]
name = "jobhunter"
version = "0.1.0"
description = "Discover job openings from ATS boards and careers pages, resolve a verified contact, score fit."
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "dnspython>=2.6",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
spa = ["playwright>=1.44"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
jobhunter = "jobhunter.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobhunter*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
