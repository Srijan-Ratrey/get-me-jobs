# Companies to watch.
#
# Every ats_token below was verified against the live board on 2026-07-31 — each
# one returned 200 with at least one open posting. Tokens are not guesses; if a
# board later 404s, `scan` reports it as a per-target failure and keeps going.
#
# `domain` is only used by contact discovery (Tier 1 scrapes the company's own
# careers/about/contact pages). If one is wrong, `jobhunter contacts` will find
# nothing for that company — correct it here rather than working around it.
#
# The `india_jobs` comments are the counts at verification time, as a rough guide
# to which targets are worth keeping. Prune freely.

