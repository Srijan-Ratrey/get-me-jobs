# Not reachable by this pipeline — apply through their own portals instead:
#
#   Google     — google.com/robots.txt disallows the careers results paths for
#                every user-agent, so enumerating their openings is off the table.
#   Microsoft  — apply.careers.microsoft.com does allow /careerhub/explore/jobs,
#                but it is not on a supported ATS and needs a custom adapter.
#
# Both were checked on 2026-07-31. Large MNCs also hire 0-1yr candidates through
# structured early-career programs, where a cold email does far less than it does
# at a startup — which is where this tool's contact discovery actually helps.
