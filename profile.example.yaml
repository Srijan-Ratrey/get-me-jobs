# What you are looking for. Drives `jobhunter score`.
#
# Copy this to profile.yaml and edit it — `jobhunter init` does that for you.
# Your real profile.yaml is gitignored, so it stays on your machine.
#
# The values below are a worked example (a junior data/ML search in Bengaluru)
# rather than a template of empty lists, because the shape of a filled-in file
# is what makes the scoring rules legible. Replace them with your own.
#
# Every score is explainable from this file alone: the `why` column in the export
# names which rule fired and what it was worth.

profile:

  # Who is applying. Used by `jobhunter outreach` for the signature and the
  # attachment, and nowhere else. Every field here ends up in a message sent to
  # a real person, so docs/compliance.md requires all of it to be true: honest
  # identification and a reply path that works.
  #
  # `name`, `email` and `resume_path` are required — the sender refuses to run
  # without them rather than mailing something anonymous or with nothing attached.
  applicant:
    name: ""              # your full name, as you want it signed
    email: ""             # the address replies should reach
    phone: ""             # optional
    resume_path: ""       # absolute path to the file to attach; must be readable
    links: []             # optional, e.g. ["https://github.com/you"]

    # Subject-line evidence, shown after the role title. Keep it short: past
    # ~72 characters the inbox truncates, and this is what earns the open.
    headline: ""          # e.g. "recsys and experimentation, 6% and 8% lift at Acme"

    # The numbers a recruiter screens on, and the reason a draft is worth
    # reading. One paragraph each, naming what you built and what it moved.
    # Without at least one, the drafter refuses: a message that only asserts
    # competence is what every other application already says.
    #
    # This text is sent verbatim, so every figure in it has to be true.
    achievements: []
    #  - >-
    #      At Acme I built a hybrid recommendation engine that lifted completion
    #      by 6%, and ran A/B experiments that raised session duration by 8%.

    education: ""         # e.g. "B.Tech in Data Science and AI from IIIT Naya Raipur"
    location: ""          # e.g. "Bengaluru"
    availability: ""      # e.g. "available immediately"
  # Matched against the job title. Partial matches count, so "Data Scientist"
  # also hits "Data Scientist II" and "Associate Data Scientist".
  titles:
    - Data Scientist
    - Machine Learning Engineer
    - ML Engineer
    - AI Engineer
    - AI/ML Engineer
    - Applied Scientist
    - Applied ML Engineer
    - Research Engineer
    - Data Analyst
    - Analytics Engineer
    - MLOps Engineer
    - Deep Learning Engineer
    - NLP Engineer
    - Computer Vision Engineer

    # Bare-noun variants. Title matching is substring-based, so "Data Scientist"
    # never matches "Data Science Intern" and "ML Engineer" never matches
    # "Product Intern (Machine Learning)". That gap was hiding 499 postings at
    # title=16 (partial overlap) instead of 40 -- 410 of them in India, and
    # almost all the junior and internship titles in the database:
    # "Data Science Intern" (Bengaluru), "Intern Masters Data Science",
    # "Machine Learning Intern", "Internship - AI/ML, Computer Vision". They
    # scored 53, one short of the shortlist.
    #
    # Measured before adding: the only titles gaining from the new words alone
    # are six like "Science Teacher" and "Medical Science Liaison", which reach
    # 32 and never surface. "Data Engineer" is the broadest of the four -- it
    # pulls in pipeline roles alongside ML ones.
    - Data Science
    - Machine Learning
    - Data Engineer
    - AI/ML

    # Forward-deployed engineering: customer-embedded ML/AI build work, common at
    # Databricks, Google Cloud, Palantir and the AI startups. Listed separately
    # because the phrase carries no profile title as a substring -- "Forward
    # Deployed Engineer" shares only the word "engineer", which the partial-match
    # branch strips, so these scored a flat 0 on title and never surfaced.
    #
    # "Deployment Strategist" is deliberately absent. Adding it puts "strategist"
    # into the partial-overlap vocabulary, which hands credit to 90+ SEO, content
    # and creative strategist postings, and it buys two Databricks rows.
    - Forward Deployed
    - Forward-Deployed
    - Forward Deployment

  # Deliberately short. These are treated as ALL-required, so every extra entry
  # lowers the ceiling on every job. Put skills you merely have in nice_to_have.
  #
  # A single entry may list pipe-separated alternatives, satisfied by ANY of
  # them. Use this when a requirement has obvious proxies: a posting can be
  # unmistakably a Python role and never type the word "Python".
  must_have_keywords:
    - python|pytorch|tensorflow|scikit-learn|sklearn|pandas|numpy|keras|jupyter|django|flask

  # Skills and tools you actually have. Each one present adds to the score.
  nice_to_have_keywords:
    - machine learning
    - deep learning
    - pytorch
    - tensorflow
    - keras
    - xgboost
    - scikit-learn
    - llm
    - large language model
    - transformers
    - langchain
    - fine-tuning
    - lora
    - prompt engineering
    - rag
    - nlp
    - computer vision
    - opencv
    - yolo
    - cnn
    - gan
    - embeddings
    - faiss
    - vector database
    - recommendation
    - collaborative filtering
    - classifier
    - evaluation
    - a/b testing
    - experimentation
    - sql
    - bigquery
    - gcp
    - vertex ai
    - mongodb
    - docker
    - flask
    - mlops
    - data pipeline
    - statistics

  # Any of these in the JOB TITLE is a hard zero — the role is out of reach at
  # 0-1 years, and a spreadsheet full of them is worse than a short one.
  # Matched on whole words against the title only, never the description: plenty
  # of good junior postings say "you'll work alongside senior engineers".
  exclude_keywords:
    - senior
    - sr
    - staff
    - principal
    - lead
    - leader
    - manager
    - management
    - director
    - head
    - vp
    - vice president
    # The acronyms, since "chief" and "vp" above only catch the spelled-out forms.
    - cto
    - ceo
    - coo
    - cfo
    - cio
    - ciso
    - chief
    - architect
    - distinguished
    - fellow
    - ii
    - iii
    - iv

    # Wrong profession, not wrong level. These are matched as whole phrases, never
    # bare words, because the disqualifying part is the role noun and not the
    # domain: "AI Sales Engineer" is a sales job, but "Data Scientist - Regional
    # Sales" is a data science job, and excluding on "sales" alone would drop the
    # second one too. Same reason "marketing" and "operations" are absent on their
    # own -- "Data Scientist, Marketing Analytics" and "Associate Data Scientist,
    # Operations Research" are both real matches.
    - sales engineer
    - business analyst
    - operations analyst
    - ops analyst
    - market analyst
    - support analyst
    - solutions consultant
    - solution consultant
    - account executive
    - account manager
    - customer success
    - sales development
    - recruiter

  # A posting demanding more than this many years is a senior role wearing a
  # neutral title, so it is also a hard zero. The scorer reads the *smallest*
  # requirement mentioned anywhere in the description, so a posting that says
  # "2+ years" in one place and "8+ years" in another is judged on the 2.
  max_years_experience: 2

  # "Bengaluru" and "Bangalore" are aliased by the scorer — ATS boards use both
  # spellings, sometimes within a single response, so listing one is enough.
  locations:
    - Bengaluru
    - India
    - Remote
  remote_only: false

  # Preferred levels. An unmarked title ("Data Scientist") gets partial credit
  # rather than zero, because most junior-appropriate roles carry no level word.
  seniority:
    - junior
    - intern

  min_score: 40
